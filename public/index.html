<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechPulse — AI и технологии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A111F;
    --bg-elev:#0F1A2E;
    --bg-elev2:#152238;
    --text:#E8ECF4;
    --text-dim:#8B96AC;
    --text-dimmer:#5C6883;
    --border:#20304C;
    --accent:#49E0D2;
    --accent-dim:#2C6F6B;
    --warn:#FF5D7E;
    --radius:2px;
    --maxw:1180px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--accent);color:#04211f;}

  /* ---------- pulse mark ---------- */
  .pulse-mark{width:26px;height:16px;flex-shrink:0;}
  .pulse-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--warn);display:inline-block;
    animation:pulse-beat 1.6s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes pulse-beat{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.5); opacity:.55; }
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,17,31,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar{
    max-width:var(--maxw);margin:0 auto;
    display:flex;align-items:center;gap:20px;
    padding:14px 20px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:20px;white-space:nowrap;}
  .brand b{font-weight:700;}
  .brand span{color:var(--accent);}
  .search-box{
    flex:1;max-width:280px;
    display:flex;align-items:center;
    border:1px solid var(--border);background:var(--bg-elev);
    border-radius:var(--radius);padding:0 10px;
  }
  .search-box input{
    background:transparent;border:none;color:var(--text);
    padding:8px 6px;width:100%;outline:none;font-size:14px;
  }
  .search-box svg{flex-shrink:0;opacity:.5;}
  .admin-link{
    font-size:13px;color:var(--text-dimmer);
    border:1px solid var(--border);padding:6px 12px;border-radius:var(--radius);
    white-space:nowrap;
  }
  .admin-link:hover{color:var(--accent);border-color:var(--accent-dim);}
  nav.cats{
    max-width:var(--maxw);margin:0 auto;
    display:flex;gap:2px;overflow-x:auto;
    padding:0 20px 12px;
    scrollbar-width:none;
  }
  nav.cats::-webkit-scrollbar{display:none;}
  nav.cats a{
    font-size:13.5px;padding:6px 12px;white-space:nowrap;
    color:var(--text-dim);border-bottom:2px solid transparent;
  }
  nav.cats a.active{color:var(--text);border-bottom-color:var(--cat-color, var(--accent));}
  nav.cats a:hover{color:var(--text);}

  /* ---------- layout ---------- */
  main{max-width:var(--maxw);margin:0 auto;padding:32px 20px 80px;}
  .section-head{
    display:flex;align-items:baseline;gap:10px;
    margin:44px 0 18px;padding-bottom:10px;border-bottom:1px solid var(--border);
  }
  .section-head h2{font-size:19px;}
  .section-head .dot{width:8px;height:8px;background:var(--cat-color,var(--accent));flex-shrink:0;}

  /* ---------- hero ---------- */
  .hero{display:flex;gap:28px;align-items:stretch;}
  .hero-main{flex:1.6;min-width:0;}
  .hero-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;}
  .art-visual{
    width:100%;aspect-ratio:16/8;position:relative;overflow:hidden;
    background:linear-gradient(135deg, var(--cat-color,#333) 0%, #0A111F 130%);
  }
  .art-visual svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55;}
  .hero-main .art-visual{aspect-ratio:16/9;}
  .cat-label{
    font-size:12px;font-weight:600;color:var(--cat-color,var(--accent));
    display:inline-flex;align-items:center;gap:6px;
  }
  .hero-main h1{font-size:32px;line-height:1.15;margin:14px 0 10px;}
  .hero-main h1:hover{color:var(--accent);}
  .excerpt{color:var(--text-dim);font-size:15px;margin:0 0 10px;}
  .meta-row{
    display:flex;align-items:center;gap:10px;
    font-size:12.5px;color:var(--text-dimmer);
    font-family:'IBM Plex Mono', monospace;
  }
  .meta-row .sep{width:1px;height:12px;background:var(--border);}
  .breaking-tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:600;color:var(--warn);
    font-family:'IBM Plex Mono', monospace;
  }

  .side-item{
    display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--border);
  }
  .side-item:first-child{border-top:none;}
  .side-item .art-visual{width:96px;height:66px;flex-shrink:0;aspect-ratio:auto;}
  .side-item .t{font-size:15px;font-weight:600;line-height:1.25;margin-bottom:6px;}
  .side-item .t:hover{color:var(--accent);}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
  .card{border-top:1px solid var(--border);padding-top:14px;}
  .card .art-visual{aspect-ratio:16/10;margin-bottom:14px;}
  .card h3{font-size:17px;line-height:1.28;margin:10px 0 8px;}
  .card h3:hover{color:var(--accent);}
  .card .excerpt{font-size:13.5px;-webkit-line-clamp:3;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}

  .empty{color:var(--text-dimmer);padding:40px 0;text-align:center;font-size:14px;}

  /* ---------- article page ---------- */
  .article-page{max-width:720px;margin:0 auto;}
  .back-link{font-size:13px;color:var(--text-dim);display:inline-block;margin-bottom:22px;}
  .back-link:hover{color:var(--accent);}
  .article-page h1{font-size:30px;line-height:1.2;margin:14px 0 14px;}
  .article-page .art-visual{aspect-ratio:16/8;margin:20px 0 26px;}
  .article-body p{font-size:16.5px;color:#D6DCEA;margin:0 0 18px;}
  .article-body{border-bottom:1px solid var(--border);padding-bottom:30px;margin-bottom:30px;}

  .comments h2{font-size:18px;margin-bottom:18px;}
  .comment{border-top:1px solid var(--border);padding:14px 0;}
  .comment .c-meta{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--text-dimmer);margin-bottom:6px;}
  .comment .c-name{color:var(--accent);}
  .comment .c-text{font-size:14.5px;color:#CBD3E3;}
  .comment-form{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
  .comment-form input, .comment-form textarea{
    background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:var(--radius);font-family:inherit;font-size:14px;outline:none;
    resize:vertical;
  }
  .comment-form textarea{min-height:80px;}
  .comment-form input:focus, .comment-form textarea:focus{border-color:var(--accent);}
  .btn{
    background:var(--accent);color:#04211f;border:none;
    padding:10px 18px;border-radius:var(--radius);font-weight:600;font-size:14px;
    align-self:flex-start;
  }
  .btn:hover{background:#63e8dc;}
  .btn.secondary{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  .btn.secondary:hover{color:var(--text);border-color:var(--text-dim);}
  .btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn);}
  .btn.danger:hover{background:var(--warn);color:#210410;}

  /* ---------- admin ---------- */
  .admin-gate{max-width:360px;margin:60px auto;text-align:center;}
  .admin-gate .art-visual{aspect-ratio:5/2;margin-bottom:24px;}
  .admin-gate input{
    width:100%;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    padding:11px 14px;border-radius:var(--radius);font-size:14px;margin-bottom:12px;outline:none;
  }
  .admin-gate input:focus{border-color:var(--accent);}
  .admin-gate .btn{width:100%;}
  .admin-note{font-size:12px;color:var(--text-dimmer);margin-top:14px;}

  .admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
  .admin-cols{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;align-items:start;}
  .admin-list{display:flex;flex-direction:column;}
  .admin-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    border-top:1px solid var(--border);padding:12px 0;
  }
  .admin-row:first-child{border-top:none;}
  .admin-row .info{min-width:0;}
  .admin-row .info .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .admin-row .info .c{font-size:12px;color:var(--text-dimmer);margin-top:3px;}
  .admin-row .actions{display:flex;gap:8px;flex-shrink:0;}
  .admin-row .actions button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    font-size:12px;padding:5px 10px;border-radius:var(--radius);
  }
  .admin-row .actions button:hover{color:var(--text);border-color:var(--text-dim);}

  .admin-form{display:flex;flex-direction:column;gap:12px;position:sticky;top:100px;}
  .admin-form label{font-size:12px;color:var(--text-dimmer);font-family:'IBM Plex Mono',monospace;}
  .admin-form input, .admin-form select, .admin-form textarea{
    background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    padding:9px 12px;border-radius:var(--radius);font-family:inherit;font-size:14px;outline:none;width:100%;
  }
  .admin-form textarea{min-height:140px;resize:vertical;}
  .admin-form input:focus, .admin-form select:focus, .admin-form textarea:focus{border-color:var(--accent);}
  .admin-form .field{display:flex;flex-direction:column;gap:5px;}
  .admin-form .row2{display:flex;gap:10px;}
  .admin-form .row2 .field{flex:1;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
  .checkbox-row input{width:auto;}
  .form-actions{display:flex;gap:10px;margin-top:4px;}

  footer{border-top:1px solid var(--border);padding:30px 20px;text-align:center;color:var(--text-dimmer);font-size:12.5px;}

  @media (max-width:860px){
    .hero{flex-direction:column;}
    .grid{grid-template-columns:1fr 1fr;}
    .admin-cols{grid-template-columns:1fr;}
    .admin-form{position:static;}
  }
  @media (max-width:560px){
    .grid{grid-template-columns:1fr;}
    .search-box{display:none;}
    .hero-main h1{font-size:26px;}
    .article-page h1{font-size:24px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ DATA ============ */
const CATEGORIES = [
  {id:'ai', label:'AI', color:'#49E0D2'},
  {id:'tech', label:'Технологии', color:'#7C9EFF'},
  {id:'mobile', label:'Мобилни', color:'#FFB86B'},
  {id:'computers', label:'Компютри', color:'#B893FF'},
  {id:'apps', label:'Приложения', color:'#6EE7B7'},
  {id:'ai-tools', label:'AI инструменти', color:'#FF9166'},
  {id:'reviews', label:'Ревюта', color:'#FFD166'},
  {id:'comparisons', label:'Сравнения', color:'#5FD3F3'},
  {id:'howto', label:'Как да', color:'#A0E85A'},
  {id:'news', label:'Новини', color:'#FF5D7E'},
];
const catById = id => CATEGORIES.find(c => c.id === id);

const SEED_ARTICLES = [
  {id:'a1', title:'Нов езиков модел обещава по-дълга памет в разговорите', excerpt:'Разработчиците твърдят, че системата задържа контекст през много по-дълги сесии, без да губи нишката на разговора.', category:'ai', author:'Ивайло Петров', date:'2026-08-29', breaking:true,
   content:`Екип от изследователи представи нова архитектура за езикови модели, която според тях удържа контекст в разговори, дълги в пъти повече от досегашните ограничения.

Ключовата промяна е в начина, по който моделът избира кои части от разговора да „запомни“ в компресиран вид, вместо да пази всичко буквално. Това намалява натоварването върху паметта, без потребителят да усеща загуба на детайли.

Първите тестове показват, че моделът се справя добре с дълги технически дискусии и с проекти, разпънати през няколко дни. Предстои независима проверка на резултатите, преди технологията да стигне до масови продукти.`},

  {id:'a2', title:'Тестваме новия сгъваем телефон: къде е компромисът', excerpt:'Екранът е впечатляващ, батерията издържа цял ден, но има един детайл, който ще раздели мненията.', category:'reviews', author:'Мария Георгиева', date:'2026-08-27', breaking:false,
   content:`След две седмици активна употреба, новото сгъваемо устройство остави смесени впечатления. Основният екран е ярък и практически без видима гънка при нормален ъгъл на гледане.

Батерията издържа пълен работен ден при умерена употреба, а камерата се справя добре на дневна светлина. Проблемът е тежината — устройството е осезаемо по-тежко от конкурентните модели, което се усеща след по-дълго държане в ръка.

За хора, които ценят големия екран пред компактността, компромисът си заслужава. За останалите — по-класически флагман остава по-удобен избор.`},

  {id:'a3', title:'Как да организираш AI инструментите си в едно ежедневие', excerpt:'Малка система от три стъпки, с която instrumентите спират да се дублират и да ти отнемат време.', category:'howto', author:'Стефан Колев', date:'2026-08-25', breaking:false,
   content:`Повечето хора, които използват няколко AI инструмента едновременно, стигат до объркване — един и същ въпрос се задава на три различни места, а резултатите не се събират никъде.

Първата стъпка е да определиш „основен“ инструмент за писане и „основен“ за проучване — не е нужно да е един и същ. Втората е да пазиш едно общо място (документ или бележник), където преместваш най-добрите резултати, вместо да скачаш между чатове.

Третата стъпка е периодично прочистване — веднъж седмично изтривай разговорите, които вече не ти трябват, за да пазиш фокус върху активните проекти.`},

  {id:'a4', title:'Сравнение: два популярни AI асистента за писане на код', excerpt:'Единият е по-бърз в кратки задачи, другият държи по-добре контекста на голям проект. Ето разликите на практика.', category:'comparisons', author:'Ивайло Петров', date:'2026-08-24', breaking:false,
   content:`Тествахме двата инструмента върху едни и същи три задачи: рефакторинг на съществуващ модул, писане на нова функционалност от нулата и откриване на грешка в чужд код.

При кратките, изолирани задачи по-бързият инструмент печели осезаемо време. При работа върху по-голям проект обаче другият инструмент показва по-добро разбиране на структурата на кода и предлага по-последователни решения.

Изборът зависи от типа работа — за бързи скриптове единият е по-удобен, за поддръжка на голяма база код другият пести повече нерви на дългосрочен план.`},

  {id:'a5', title:'Нов процесор за лаптопи обещава двойна автономност', excerpt:'Производителят твърди значителен скок в енергийната ефективност без загуба на производителност.', category:'computers', author:'Диана Николова', date:'2026-08-22', breaking:false,
   content:`Новото поколение процесори за тънки лаптопи залага на архитектура, при която по-голямата част от ежедневните задачи се обработват от енергийно ефективни ядра, а мощните ядра се включват само при нужда.

Независимо от маркетинговите обещания, реалната автономност зависи силно от софтуерната оптимизация на всеки производител на лаптопи. Първите независими тестове се очакват след официалното пускане на пазара.

Ако резултатите се потвърдят, това би било една от най-съществените стъпки напред от няколко поколения насам.`},

  {id:'a6', title:'Приложение за фокус събира ред в работния ден', excerpt:'Проста идея — един таймер и една задача на екрана — но изпълнението прави разликата.', category:'apps', author:'Мария Георгиева', date:'2026-08-20', breaking:false,
   content:`Приложението залага на минимализъм — при отваряне виждаш само текущата задача и таймер, без известия, ленти и допълнителни менюта.

Тестовете ни показват, че липсата на визуален шум наистина помага за по-дълги периоди на концентрация, особено при задачи, изискващи писане или четене.

Не е инструмент за управление на сложни проекти, но за единична дневна фокус сесия върши точно това, за което е замислен.`},

  {id:'a7', title:'AI инструмент за редакция на снимки прескача цяла стъпка от процеса', excerpt:'Вместо слоеве и маски, инструментът приема обикновено текстово описание на промяната.', category:'ai-tools', author:'Стефан Колев', date:'2026-08-18', breaking:false,
   content:`Новият инструмент за редакция позволява промени чрез просто описание — например премахване на обект от фона или промяна на осветлението — без нужда от ръчно маркиране на области.

При тестове с портретни снимки резултатите са убедителни в повечето случаи, но при сложни сцени с много обекти инструментът все още прави забележими грешки по краищата.

За бързи корекции спестява време, но за професионална ретуш класическите инструменти засега остават по-предвидими.`},

  {id:'a8', title:'Регулаторен орган поставя нови изисквания към AI системи', excerpt:'Новите правила засягат прозрачността на данните за обучение на по-големите модели.', category:'news', author:'Диана Николова', date:'2026-08-30', breaking:false,
   content:`Новите изисквания задължават компаниите, разработващи по-мащабни модели, да оповестяват общи категории данни, използвани за обучение, без да разкриват търговски тайни.

Реакциите в бранша са смесени — по-малките компании приветстват по-ясните правила, докато част от по-големите играчи предупреждават за административна тежест.

Прилагането на новите изисквания предстои постепенно през следващите месеци, а окончателните насоки все още се уточняват.`},

  {id:'a9', title:'Технологичен гигант обявява преработка на операционната система', excerpt:'Фокусът е върху по-бърза навигация и по-дълбока интеграция на AI функции в системата.', category:'tech', author:'Ивайло Петров', date:'2026-08-28', breaking:false,
   content:`Компанията представи ранна визия за следващата версия на своята операционна система, като акцентира върху опростена навигация и вградени AI функции на системно ниво, вместо в отделни приложения.

Част от промените са козметични, но по-съществената е новата система за търсене, която според демонстрацията разбира по-сложни, естествено формулирани заявки.

Пълната версия се очаква в началото на следващата година, като част от функциите вероятно ще стигнат първо до по-новите устройства.`},

  {id:'a10', title:'Евтин смартфон изненадва с камера над очакваното', excerpt:'В бюджетния сегмент рядко се вижда такъв скок в качеството на снимките при слаба светлина.', category:'mobile', author:'Мария Георгиева', date:'2026-08-26', breaking:false,
   content:`Тестовете с новия бюджетен модел показаха резултати, необичайни за ценовия сегмент — особено при снимки на закрито и при слабо осветление, където по-евтините устройства обикновено изостават осезаемо.

Екранът и производителността остават на очаквано ниво за цената, без изненади в добра или лоша посока.

За хора, за които камерата е приоритет, но бюджетът е ограничен, това е един от малкото модели тази година, които си заслужават разглеждане.`},
];

/* ============ STATE ============ */
let articles = [];
let adminUnlocked = false;
let adminKey = localStorage.getItem('tp_admin_key') || null;
let editingId = null;

/* ============ API (Cloudflare Pages Functions + D1) ============ */
async function loadArticles(){
  try{
    const res = await fetch('/api/articles');
    if(!res.ok) throw new Error('bad response');
    articles = await res.json();
  }catch(e){
    articles = SEED_ARTICLES.slice();
  }
}
async function loadComments(articleId){
  try{
    const res = await fetch('/api/comments/'+encodeURIComponent(articleId));
    if(!res.ok) throw new Error('bad response');
    return await res.json();
  }catch(e){ return []; }
}
async function addComment(articleId, name, text){
  await fetch('/api/comments/'+encodeURIComponent(articleId), {
    method:'POST',
    headers:{'content-type':'application/json'},
    body: JSON.stringify({name, text}),
  });
  return await loadComments(articleId);
}
async function apiLogin(password){
  const res = await fetch('/api/login', {
    method:'POST',
    headers:{'content-type':'application/json'},
    body: JSON.stringify({password}),
  });
  if(!res.ok) return false;
  adminKey = password;
  localStorage.setItem('tp_admin_key', password);
  return true;
}
async function apiCreateArticle(data){
  const res = await fetch('/api/articles', {
    method:'POST',
    headers:{'content-type':'application/json','x-admin-key':adminKey},
    body: JSON.stringify(data),
  });
  return res.ok;
}
async function apiUpdateArticle(id, data){
  const res = await fetch('/api/articles/'+encodeURIComponent(id), {
    method:'PUT',
    headers:{'content-type':'application/json','x-admin-key':adminKey},
    body: JSON.stringify(data),
  });
  return res.ok;
}
async function apiDeleteArticle(id){
  const res = await fetch('/api/articles/'+encodeURIComponent(id), {
    method:'DELETE',
    headers:{'x-admin-key':adminKey},
  });
  return res.ok;
}

/* ============ HELPERS ============ */
function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function timeAgo(dateStr){ return dateStr; }

function visualSvg(color){
  const id = 'g'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 300 160" preserveAspectRatio="none">
    <polyline points="0,90 30,90 45,40 60,130 80,90 300,90" fill="none" stroke="${color}" stroke-width="3" opacity="0.9"/>
    <polyline points="0,110 40,110 55,70 75,150 100,110 300,110" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.35"/>
  </svg>`;
}
function visual(article){
  const c = catById(article && article.category);
  const color = c ? c.color : '#49E0D2';
  if(article && article.image){
    return `<div class="art-visual" style="--cat-color:${color}"><img src="${esc(article.image)}" alt="${esc(article.title||'')}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;"></div>`;
  }
  return `<div class="art-visual" style="--cat-color:${color}">${visualSvg(color)}</div>`;
}

function catLabel(catId, withDot){
  const c = catById(catId);
  if(!c) return '';
  return `<span class="cat-label" style="--cat-color:${c.color}">${withDot?'<span class="pulse-dot" style="background:'+c.color+';animation:none"></span>':''}${esc(c.label)}</span>`;
}

/* ============ ROUTING ============ */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts.length === 0) return {view:'home'};
  if(parts[0] === 'category') return {view:'category', cat: decodeURIComponent(parts[1]||'')};
  if(parts[0] === 'article') return {view:'article', id: decodeURIComponent(parts[1]||'')};
  if(parts[0] === 'search') return {view:'search', q: decodeURIComponent(parts[1]||'')};
  if(parts[0] === 'admin') return {view:'admin'};
  return {view:'home'};
}
window.addEventListener('hashchange', render);

/* ============ RENDER: SHELL ============ */
function shellHeader(route){
  const catLinks = [`<a href="#/" class="${route.view==='home'?'active':''}">Начало</a>`]
    .concat(CATEGORIES.map(c => {
      const active = route.view==='category' && route.cat===c.id;
      return `<a href="#/category/${c.id}" style="--cat-color:${c.color}" class="${active?'active':''}">${esc(c.label)}</a>`;
    })).join('');
  return `
  <header>
    <div class="topbar">
      <a href="#/" class="brand">
        <svg class="pulse-mark" viewBox="0 0 26 16"><polyline points="0,8 7,8 10,1 13,15 16,8 26,8" fill="none" stroke="#49E0D2" stroke-width="2"/></svg>
        <b>Tech<span>Pulse</span></b>
      </a>
      <form class="search-box" onsubmit="doSearch(event)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Търсене..." value="${route.view==='search'?esc(route.q):''}">
      </form>
      <a href="#/admin" class="admin-link">Админ</a>
    </div>
    <nav class="cats">${catLinks}</nav>
  </header>`;
}
function doSearch(e){
  e.preventDefault();
  const v = document.getElementById('searchInput').value.trim();
  location.hash = '#/search/' + encodeURIComponent(v);
  return false;
}

/* ============ RENDER: HOME ============ */
function renderHome(){
  const breaking = articles.find(a => a.breaking) || articles[0];
  const others = articles.filter(a => a.id !== (breaking && breaking.id));
  const sideItems = others.slice(0,3);
  const gridItems = others.slice(3);

  const heroHtml = breaking ? `
    <div class="hero">
      <div class="hero-main">
        <a href="#/article/${breaking.id}">${visual(breaking)}</a>
        ${breaking.breaking ? `<div class="breaking-tag"><span class="pulse-dot"></span> НА ЖИВО</div>` : ''}
        ${catLabel(breaking.category)}
        <a href="#/article/${breaking.id}"><h1>${esc(breaking.title)}</h1></a>
        <p class="excerpt">${esc(breaking.excerpt)}</p>
        <div class="meta-row"><span>${esc(breaking.author)}</span><span class="sep"></span><span>${esc(breaking.date)}</span></div>
      </div>
      <div class="hero-side">
        ${sideItems.map(a => `
          <div class="side-item">
            <a href="#/article/${a.id}">${visual(a)}</a>
            <div>
              ${catLabel(a.category)}
              <a href="#/article/${a.id}"><div class="t">${esc(a.title)}</div></a>
              <div class="meta-row"><span>${esc(a.date)}</span></div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>` : '';

  const gridHtml = gridItems.length ? `
    <div class="section-head"><span class="dot"></span><h2>Последно от TechPulse</h2></div>
    <div class="grid">
      ${gridItems.map(a => cardHtml(a)).join('')}
    </div>` : '';

  return heroHtml + gridHtml;
}
function cardHtml(a){
  return `
    <div class="card">
      <a href="#/article/${a.id}">${visual(a)}</a>
      ${catLabel(a.category)}
      <a href="#/article/${a.id}"><h3>${esc(a.title)}</h3></a>
      <p class="excerpt">${esc(a.excerpt)}</p>
      <div class="meta-row"><span>${esc(a.author)}</span><span class="sep"></span><span>${esc(a.date)}</span></div>
    </div>`;
}

/* ============ RENDER: CATEGORY ============ */
function renderCategory(catId){
  const c = catById(catId);
  const list = articles.filter(a => a.category === catId);
  return `
    <div class="section-head" style="--cat-color:${c?c.color:'#49E0D2'}"><span class="dot"></span><h2>${c?esc(c.label):'Категория'}</h2></div>
    ${list.length ? `<div class="grid">${list.map(cardHtml).join('')}</div>` : `<div class="empty">Все още няма статии в тази категория.</div>`}
  `;
}

/* ============ RENDER: SEARCH ============ */
function renderSearch(q){
  const ql = q.toLowerCase();
  const list = articles.filter(a => a.title.toLowerCase().includes(ql) || a.excerpt.toLowerCase().includes(ql));
  return `
    <div class="section-head"><span class="dot"></span><h2>Резултати за „${esc(q)}“</h2></div>
    ${list.length ? `<div class="grid">${list.map(cardHtml).join('')}</div>` : `<div class="empty">Няма намерени статии.</div>`}
  `;
}

/* ============ RENDER: ARTICLE ============ */
async function renderArticleView(id){
  const a = articles.find(x => x.id === id);
  const app = document.getElementById('app');
  if(!a){ location.hash = '#/'; return; }
  const paragraphs = a.content.replace(/\\n/g, '\n').split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join('');
  const comments = await loadComments(id);

  app.innerHTML = shellHeader({view:'article'}) + `
    <main>
      <div class="article-page">
        <a href="#/" class="back-link">← Начало</a>
        ${catLabel(a.category)}
        <h1>${esc(a.title)}</h1>
        <div class="meta-row"><span>${esc(a.author)}</span><span class="sep"></span><span>${esc(a.date)}</span></div>
        ${visual(a)}
        <div class="article-body">${paragraphs}</div>
        <div class="comments">
          <h2>Коментари (${comments.length})</h2>
          <div id="commentsList">${renderComments(comments)}</div>
          <form class="comment-form" onsubmit="submitComment(event,'${id}')">
            <input id="cName" type="text" placeholder="Твоето име" required>
            <textarea id="cText" placeholder="Напиши коментар..." required></textarea>
            <button type="submit" class="btn">Публикувай коментар</button>
          </form>
        </div>
      </div>
    </main>
    ${footerHtml()}
  `;
}
function renderComments(list){
  if(!list.length) return `<div class="empty" style="padding:20px 0;text-align:left">Все още няма коментари. Бъди първи.</div>`;
  return list.map(c => `
    <div class="comment">
      <div class="c-meta"><span class="c-name">${esc(c.name)}</span> · ${esc(c.date)}</div>
      <div class="c-text">${esc(c.text)}</div>
    </div>
  `).join('');
}
async function submitComment(e, articleId){
  e.preventDefault();
  const name = document.getElementById('cName').value.trim();
  const text = document.getElementById('cText').value.trim();
  if(!name || !text) return false;
  const list = await addComment(articleId, name, text);
  document.getElementById('commentsList').innerHTML = renderComments(list);
  document.querySelector('.comments h2').textContent = `Коментари (${list.length})`;
  e.target.reset();
  return false;
}

/* ============ RENDER: ADMIN ============ */
function renderAdminGate(){
  return `
    <main>
      <div class="admin-gate">
        ${visual({category:'ai'})}
        <h2 style="margin-bottom:16px;">Админ панел</h2>
        <input id="adminPass" type="password" placeholder="Парола">
        <button class="btn" onclick="tryAdminLogin()">Вход</button>
        <div class="admin-note">Паролата се задава от теб в Cloudflare (ADMIN_PASSWORD) и се проверява на сървъра — не в браузъра.</div>
      </div>
    </main>
  `;
}
async function tryAdminLogin(){
  const inp = document.getElementById('adminPass');
  const val = inp.value;
  const ok = await apiLogin(val);
  if(ok){
    adminUnlocked = true;
    render();
  }else{
    inp.style.borderColor = '#FF5D7E';
    inp.value = '';
    inp.placeholder = 'Грешна парола, опитай пак';
  }
}
function renderAdminPanel(){
  const editing = editingId ? articles.find(a => a.id === editingId) : null;
  return `
    <main>
      <div class="admin-head">
        <h2>Управление на статии</h2>
        <button class="btn secondary" onclick="adminUnlocked=false;adminKey=null;localStorage.removeItem('tp_admin_key');render()">Изход</button>
      </div>
      <div class="admin-cols">
        <div class="admin-list">
          ${articles.slice().reverse().map(a => `
            <div class="admin-row">
              <div class="info">
                <div class="t">${esc(a.title)}</div>
                <div class="c">${esc(catById(a.category) ? catById(a.category).label : '')} · ${esc(a.date)}${a.breaking?' · На живо':''}</div>
              </div>
              <div class="actions">
                <button onclick="startEdit('${a.id}')">Редакция</button>
                <button onclick="deleteArticle('${a.id}')">Изтрий</button>
              </div>
            </div>
          `).join('')}
        </div>
        <form class="admin-form" onsubmit="saveArticleForm(event)">
          <div class="field"><label>ЗАГЛАВИЕ</label><input id="fTitle" required value="${editing?esc(editing.title):''}"></div>
          <div class="field"><label>КРАТКО ОПИСАНИЕ</label><input id="fExcerpt" required value="${editing?esc(editing.excerpt):''}"></div>
          <div class="row2">
            <div class="field"><label>КАТЕГОРИЯ</label>
              <select id="fCategory">
                ${CATEGORIES.map(c => `<option value="${c.id}" ${editing&&editing.category===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>АВТОР</label><input id="fAuthor" required value="${editing?esc(editing.author):''}"></div>
          </div>
          <div class="field"><label>СЪДЪРЖАНИЕ (раздели абзаците с празен ред)</label><textarea id="fContent" required>${editing?esc(editing.content):''}</textarea></div>
          <div class="field"><label>СНИМКА (URL адрес, по избор)</label><input id="fImage" placeholder="https://..." value="${editing&&editing.image?esc(editing.image):''}"></div>
          <label class="checkbox-row"><input type="checkbox" id="fBreaking" ${editing&&editing.breaking?'checked':''}> Маркирай като водеща/На живо новина</label>
          <div class="form-actions">
            <button type="submit" class="btn">${editing?'Запази промените':'Публикувай статия'}</button>
            ${editing?`<button type="button" class="btn secondary" onclick="editingId=null;render()">Отказ</button>`:''}
          </div>
        </form>
      </div>
    </main>
  `;
}
function startEdit(id){ editingId = id; render(); window.scrollTo(0,0); }
async function deleteArticle(id){
  if(!confirm('Сигурен ли си, че искаш да изтриеш тази статия?')) return;
  const ok = await apiDeleteArticle(id);
  if(!ok){ alert('Изтриването не бе успешно. Влез отново в админ панела.'); adminUnlocked=false; render(); return; }
  await loadArticles();
  if(editingId === id) editingId = null;
  render();
}
async function saveArticleForm(e){
  e.preventDefault();
  const data = {
    title: document.getElementById('fTitle').value.trim(),
    excerpt: document.getElementById('fExcerpt').value.trim(),
    category: document.getElementById('fCategory').value,
    author: document.getElementById('fAuthor').value.trim(),
    content: document.getElementById('fContent').value.trim(),
    image: document.getElementById('fImage').value.trim(),
    breaking: document.getElementById('fBreaking').checked,
  };
  if(!data.title || !data.excerpt || !data.content || !data.author) return false;
  let ok;
  if(editingId){
    ok = await apiUpdateArticle(editingId, data);
  }else{
    ok = await apiCreateArticle(data);
  }
  if(!ok){ alert('Записът не бе успешен. Влез отново в админ панела.'); adminUnlocked=false; render(); return false; }
  await loadArticles();
  editingId = null;
  render();
  return false;
}

/* ============ FOOTER ============ */
function footerHtml(){
  return `<footer>TechPulse · AI и технологии</footer>`;
}

/* ============ MAIN RENDER ============ */
async function render(){
  const route = parseHash();
  const app = document.getElementById('app');

  if(route.view === 'article'){
    await renderArticleView(route.id);
    return;
  }
  if(route.view === 'admin'){
    if(!adminUnlocked && adminKey){
      adminUnlocked = await apiLogin(adminKey);
    }
    if(!adminUnlocked){
      app.innerHTML = shellHeader(route) + renderAdminGate();
    }else{
      app.innerHTML = shellHeader(route) + renderAdminPanel();
    }
    return;
  }

  let body = '';
  if(route.view === 'home') body = renderHome();
  else if(route.view === 'category') body = renderCategory(route.cat);
  else if(route.view === 'search') body = renderSearch(route.q);

  app.innerHTML = shellHeader(route) + `<main>${body}</main>` + footerHtml();
}

/* ============ INIT ============ */
(async function init(){
  document.getElementById('app').innerHTML = `<div style="padding:60px;text-align:center;color:#8B96AC;font-family:'IBM Plex Mono',monospace;">Зареждане на TechPulse...</div>`;
  await loadArticles();
  render();
})();
</script>
</body>
</html>
